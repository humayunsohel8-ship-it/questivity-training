name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  database:
    name: Database migrations & security tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply shim, migrations and seed
        run: |
          set -e
          for f in supabase/tests/00_supabase_shim.sql supabase/migrations/*.sql supabase/seed.sql; do
            echo "→ $f"; psql -v ON_ERROR_STOP=1 -q -f "$f" > /dev/null
          done
      - name: Run business-rule tests
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/tests/10_business_rules.sql

  app:
    name: Type-check & build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
